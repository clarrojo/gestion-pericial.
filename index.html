const app=document.querySelector('#app');let db=[],storage,selected,showClosed=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('gestion-pericial',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function save(){return new Promise((ok,no)=>{try{let t=storage.transaction('data','readwrite');t.objectStore('data').put(db,'cases');t.oncomplete=()=>{ok(true);if(!driveBusy) scheduleSync()};t.onabort=t.onerror=()=>{alert('No se ha guardado. Conserva la pantalla y exporta una copia.');ok(false)}}catch(e){alert('Almacenamiento no disponible');ok(false)}})}async function init(){try{storage=await openDB();let r=storage.transaction('data').objectStore('data').get('cases');db=await new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)});home()}catch(e){app.textContent='No se puede abrir el almacenamiento. Usa Chrome o Edge desde HTTPS o localhost.'}}const download=(name,data,type)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function home(){app.innerHTML=`<section><nav><button onclick="list('all')">Todos los expedientes (${db.length})</button><button onclick="newCaseForm()">＋ Crear expediente</button><button onclick="list('pending')">📅 Pendientes de visitar (${db.filter(c=>!c.closed&&!c.visited).length})</button><button onclick="list(false)">☷ Expedientes abiertos (${db.filter(c=>!c.closed&&c.visited).length})</button><button onclick="list(true)">▣ Expedientes cerrados</button></nav></section><section><button onclick="download('expedientes.json',JSON.stringify(db),'application/json')">Exportar copia de seguridad</button><p><small>Expedientes locales. Sincronización de visitas con Google Calendar; Drive automático mientras Google esté conectado.</small></p><label>Restaurar copia JSON<input type=file accept=".json" onchange="restore(this)"></label></section>`}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d)||!d.every(c=>typeof c.id==='string'&&typeof c.num==='string'&&Array.isArray(c.tasks)))throw Error();if(confirm('¿Sustituir todos los expedientes locales por esta copia?')){db=d;await save();home()}}catch{alert('Copia no válida')}}function newCaseForm(){app.innerHTML=`<section><h2>Nuevo expediente</h2><form id="caseForm"><label>Número<input name=num required></label><label>Dirección<input name=addr required></label><label>Teléfono<input name=phone type=tel></label><label>Fecha y hora de visita<input type="datetime-local" name="visit"></label><button type="button" id="createCaseButton" class="primary">Crear expediente</button></form></section>`;const form=document.getElementById('caseForm');const submitCase=async()=>{if(!form.reportValidity())return;let d={num:form.elements.namedItem('num').value,addr:form.elements.namedItem('addr').value,phone:form.elements.namedItem('phone').value};d.num=d.num.trim();if(!d.num||!d.addr.trim()||db.some(c=>c.num===d.num)){alert('Número vacío o duplicado');return}let c={...d,id:crypto.randomUUID().replace(/-/g,''),created:new Date().toISOString(),closed:false,visited:false,visit:form.elements.namedItem("visit").value,tasks:[],notes:'',sketches:[],photos:[]};db.push(c);if(!await save()){db.pop();return;}detail(c.id);queueCalendar(c)};document.getElementById("createCaseButton").addEventListener("click",submitCase);form.addEventListener("submit",e=>{e.preventDefault();submitCase()})}function list(v){showClosed=v;app.innerHTML=`<section><h2>${v==='all'?'Todos los expedientes':'Expedientes'} ${v==='all'?'':v==='pending'?'pendientes de visitar':v?'cerrados':'abiertos'}</h2><input id=q placeholder="Buscar número o dirección" oninput="rows()"><select id=sort onchange=" document.querySelector('#task').onsubmit=async e=>{e.preventDefault();c.tasks.push({...Object.fromEntries(new FormData(e.target)),done:false});await save();detail(id)}}async function setVisit(v){let old=selected.visit;selected.visit=v;if(!await save()){selected.visit=old;detail(selected.id);return}let c=selected;detail(c.id);queueCalendar(c)}async function finishVisit(){let c=selected;c.visited=true;if(!await save())c.visited=false;detail(c.id)}function gps(){if(!isSecureContext)return alert("El GPS requiere HTTPS o localhost.");if(!navigator.geolocation)return alert('GPS no disponible');navigator.geolocation.getCurrentPosition(async p=>{selected.gps=`${p.coords.latitude}, ${p.coords.longitude} · precisión ${Math.round(p.coords.accuracy)} m · ${new Date().toLocaleString()}`;await save();detail(selected.id)},e=>alert('No se pudo obtener ubicación: '+e.message),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}async function photos(el,capture=false){let c=selected;for(let f of el.files){let url=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(capture)download(f.name||"foto.jpg",f,f.type||"image/jpeg");c.photos.push({name:f.name,data:url});if(!await save()){c.photos.pop();break}}detail(c.id)}function editor(){app.innerHTML=`<section><h2>Notas y croquis</h2><textarea id=notes rows=5 placeholder="Observaciones">${esc(selected.notes)}</textarea><div class=row><button onclick="ink='black'">Negro</button><button onclick="ink='red'">Rojo</button><button onclick="ink='blue'">Azul</button><button onclick="ctx.clearRect(0,0,800,500)">Borrar</button></div><canvas id=canvas width=800 height=500></canvas><button onclick="document.querySelector('#canvas').toBlob(b=>{if(b)download('croquis.png',b,'image/png')})">Descargar PNG</button><button class=primary onclick="storeSketch()">Guardar croquis</button><button onclick="saveNotes()">Guardar notas y volver</button>${selected.sketches.map(s=>`<img style="width:100%;border:1px solid #ddd;margin-top:8px" src="${esc(s)}">`).join('')}</section>`;let c=document.querySelector('#canvas');ctx=c.getContext('2d');let active=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(active){ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>active=false}let ctx,ink='black';async function storeSketch(){selected.notes=document.querySelector('#notes').value;selected.sketches.push(document.querySelector('#canvas').toDataURL());if(await save()){alert("Croquis guardado. Puedes seguir dibujando o iniciar otro.");}else selected.sketches.pop()}async function changeClosed(){let c=selected;c.closed=!c.closed;if(!await save()){c.closed=!c.closed;return}list(c.closed?true:c.visited?false:"pending")}async function saveNotes(){selected.notes=document.querySelector("#notes").value;if(await save())detail(selected.id)}const CLIENT_ID='611453341213-lv726ljvse5v0r8h85s05klsnsnmo1j0.apps.googleusercontent.com';

const ds=t=>document.getElementById('driveStatus').textContent=t;

async function upload(name,parent,key,content,mime='application/json'){let a=await files("'"+dq(parent)+"' in parents and appProperties has { key='gpKey' and value='"+dq(key)+"' }");if(a.length>1)throw Error('Archivos duplicados: '+name);let meta={name,appProperties:{gpKey:key},...(!a.length?{parents:[parent]}:{})};let blob=new Blob(['--gpboundary\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n',JSON.stringify(meta),'\r\n--gpboundary\r\nContent-Type: '+mime+'\r\n\r\n',content,'\r\n--gpboundary--']);return drive('/upload/drive/v3/files'+(a.length?'/'+a[0].id:'')+'?uploadType=multipart&fields=id',a.length?'PATCH':'POST',blob,true)}

async function sheetRegister(data,conflicts){let a=await files("'"+dq(data.id)+"' in parents and appProperties has { key='gpKey' and value='register-sheet' }");if(a.length>1)throw Error('Registro duplicado');let f=a[0]||await drive('/drive/v3/files?fields=id','POST',{name:'Registro de expedientes',mimeType:'application/vnd.google-apps.spreadsheet',parents:[data.id],appProperties:{gpKey:'register-sheet'}});let values=[['Expediente','Dirección','Teléfono','Visita','Estado','Tareas pendientes','Creado'],...db.filter(c=>!conflicts.includes(c.num)).map(c=>[c.num,c.addr,c.phone||'',c.visit||'',c.closed?'Cerrado':c.visited?'En tramitación':'Pendiente de visita',c.tasks.filter(t=>!t.done).length,c.created||''])];let url='https://sheets.googleapis.com/v4/spreadsheets/'+f.id;let headers={Authorization:'Bearer '+token,'Content-Type':'application/json'};let meta=await fetch(url+'?fields=sheets(properties(title))',{headers});if(!meta.ok)throw Error('Sheets: '+meta.status);let title=(await meta.json()).sheets[0].properties.title;let range=encodeURIComponent("'"+title.replace(/'/g,"''")+"'!A1:G" );let r=await fetch(url+'/values/'+range+'?valueInputOption=RAW',{method:'PUT',headers,body:JSON.stringify({values})});if(!r.ok)throw Error('Sheets: '+r.status);let clear=await fetch(url+'/values/'+encodeURIComponent("'"+title.replace(/'/g,"''")+"'!A"+(values.length+1)+":G")+':clear',{method:'POST',headers,body:'{}'});if(!clear.ok)throw Error('Sheets: '+clear.status);}
async function syncDrive(){if(driveBusy)return; if(document.querySelector("#canvas,#caseForm") || document.activeElement?.matches("input,textarea,select")){ds("Guarda o termina la edición antes de sincronizar.");return;}if(!token)return ds('Conecta con Google primero.');driveBusy=true;app.inert=true;ds('Sincronizando… No edites expedientes durante este proceso.');try{let root=await folder('Gestión Pericial',null,'root');driveRoot=root.id;let opened=await folder('Expedientes abiertos',root.id,'open'),closed=await folder('Expedientes cerrados',root.id,'closed'),data=await folder('Datos de la aplicación',root.id,'data');let baseKey='gp-base-'+root.id;driveBase=JSON.parse(localStorage.getItem(baseKey)||'{}');let remote=await files("'"+dq(data.id)+"' in parents");let map=new Map();for(let f of remote){if(!f.appProperties?.gpKey?.startsWith('case-'))continue;let c=await readCloud(f);if(map.has(c.id))throw Error('Expediente duplicado en Drive');map.set(c.id,c)}
let conflicts=[];for(let [id,r] of map){let l=db.find(c=>c.id===id),rh=await digest(r);if(!l){if(db.some(c=>c.num===r.num)){conflicts.push(r.num);continue}db.push(r);driveBase[id]=rh;continue}let lh=await digest(l),base=driveBase[id];if(lh===rh){driveBase[id]=rh;continue}if(lh===base){db[db.indexOf(l)]=r;driveBase[id]=rh}else if(rh!==base){conflicts.push(l.num)}}
if(!await save())throw Error('No se pudo guardar la copia local');for(let c of db){if(conflicts.includes(c.num))continue;let h=await digest(c);if(h===driveBase[c.id]&&map.has(c.id))continue;let parent=c.closed?closed.id:opened.id;let f=await folder(c.num+' - '+c.addr,parent,'folder-'+c.id);if(!f.parents?.includes(parent)){await drive('/drive/v3/files/'+f.id+'?'+new URLSearchParams({addParents:parent,removeParents:(f.parents||[]).join(',')}),'PATCH',{})}let ph=await folder('Fotografías',f.id,'photos-'+c.id),nt=await folder('Croquis y notas',f.id,'notes-'+c.id);await folder('Documentación',f.id,'docs-'+c.id);if(c.gps)await upload('Ubicación.txt',f.id,'gps',c.gps,'text/plain');await upload('Notas.txt',nt.id,'notes',c.notes||'','text/plain');for(let [i,x] of c.photos.entries()){let b=await (await fetch(x.data)).blob();await upload(x.name||'Foto-'+i,ph.id,'photo-'+i,b,b.type)}for(let [i,x] of c.sketches.entries()){let b=await (await fetch(x)).blob();await upload('Croquis-'+(i+1)+'.png',nt.id,'sketch-'+i,b,'image/png')}await upload(c.num+'.json',data.id,'case-'+c.id,JSON.stringify(c));driveBase[c.id]=h;localStorage.setItem(baseKey,JSON.stringify(driveBase))}localStorage.setItem(baseKey,JSON.stringify(driveBase));let settings=remote.find(f=>f.appProperties?.gpKey==='settings');if(settings){let cfg=await readCloud(settings);if(cfg.calendarId){calendarId=cfg.calendarId;localStorage.setItem('gp-calendar-id',calendarId)}}else{let prior=localStorage.getItem('gp-calendar-id');if(prior){await api('/calendars/'+encodeURIComponent(prior));calendarId=prior;await upload('Configuración.json',data.id,'settings',JSON.stringify({calendarId}))}}if(document.querySelector("#task") && selected){detail(selected.id)}else if(document.querySelector("#rows")){list(showClosed)}else{home()}let sheetWarning='';try{if(!conflicts.length)await sheetRegister(data,conflicts)}catch(e){sheetWarning=' · Registro Sheets pendiente: '+e.message}ds(conflicts.length?'Conflictos sin sobrescribir: '+conflicts.join(', '):'Expedientes sincronizados. '+db.length+' expedientes (consulta Todos los expedientes). · '+new Date().toLocaleTimeString()+sheetWarning);}catch(e){ds(e.message+' · Datos locales conservados.')}finally{driveBusy=false;app.inert=false}}

let syncTimer;function scheduleSync(){clearTimeout(syncTimer);if(!navigator.onLine){ds('Sin conexión · cambios guardados localmente');return}if(!token||Date.now()>expires-30000){ds('Cambios locales · conecta Google para sincronizar');return}syncTimer=setTimeout(autoSync,1800)}
async function autoSync(){if(!navigator.onLine||driveBusy||busy)return;if(!token||Date.now()>expires-30000){ds('Google desconectado o autorización caducada · cambios locales conservados');return;}if(document.hidden||document.querySelector('#canvas,#caseForm')||document.activeElement?.matches('input,textarea,select'))return;await syncDrive()}
window.addEventListener('online',scheduleSync);window.addEventListener('focus',scheduleSync);window.addEventListener('offline',()=>ds('Sin conexión · datos locales conservados'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)scheduleSync()});setInterval(autoSync,120000);
function exportCase(){download(selected.num+'.json',JSON.stringify(selected),'application/json')}async function start(){await init();if(!storage)return;try{let r=JSON.parse(sessionStorage.getItem('gp-session')||'null');if(r?.token&&r.expires>Date.now()+30000){token=r.token;expires=r.expires;statusGoogle('Google conectado (sesión vigente).');await syncDrive()}else if(localStorage.getItem('gp-authorized')&&navigator.onLine){statusGoogle('Sesión caducada o cerrada. Pulsa Conectar con Google.')}}catch(e){statusGoogle('Conecta con Google para sincronizar.')}}start();if("serviceWorker" in navigator && isSecureContext)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(console.warn);</script></html>
