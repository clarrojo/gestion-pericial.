<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#245b91"><title>Gestión Pericial v1.3</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f1f4f7;color:#203040;margin:0}main{max-width:850px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #ccd4dd;border-radius:9px}button{cursor:pointer;background:white;color:#203040}button.primary{background:#245b91;color:white;border:0}input,textarea,select{width:100%;margin:5px 0 12px}section,article{background:white;border-radius:12px;padding:16px;margin:12px 0}nav{display:grid;gap:12px}nav button{text-align:left;padding:20px;font-weight:600}small{color:#64748b}a{color:#245b91}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=checkbox]{width:auto;margin:0}.late{color:#b91c1c}canvas{width:100%;background:white;border:1px solid #aaa;touch-action:none}h2{font-size:20px}label{display:block} .grow{flex:1}</style><main><header><h1>Gestión pericial</h1><button onclick="home()">Inicio</button></header><div id="app"></div></main><script>
const app=document.querySelector('#app');let db=[],storage,selected,showClosed=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('gestion-pericial',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function save(){return new Promise((ok,no)=>{try{let t=storage.transaction('data','readwrite');t.objectStore('data').put(db,'cases');t.oncomplete=()=>ok(true);t.onabort=t.onerror=()=>{alert('No se ha guardado. Conserva la pantalla y exporta una copia.');ok(false)}}catch(e){alert('Almacenamiento no disponible');ok(false)}})}async function init(){try{storage=await openDB();let r=storage.transaction('data').objectStore('data').get('cases');db=await new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)});home()}catch(e){app.textContent='No se puede abrir el almacenamiento. Usa Chrome o Edge desde HTTPS o localhost.'}}const download=(name,data,type)=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function home(){app.innerHTML=`<section><nav><button onclick="newCaseForm()">＋ Crear expediente</button><button onclick="list('pending')">📅 Pendientes de visitar (${db.filter(c=>!c.closed&&!c.visited).length})</button><button onclick="list(false)">☷ Expedientes abiertos (${db.filter(c=>!c.closed&&c.visited).length})</button><button onclick="list(true)">▣ Expedientes cerrados</button></nav></section><section><button onclick="download('expedientes.json',JSON.stringify(db),'application/json')">Exportar copia de seguridad</button><p><small>Datos locales de este navegador. Sin sincronización.</small></p><label>Restaurar copia JSON<input type=file accept=".json" onchange="restore(this)"></label></section>`}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d)||!d.every(c=>typeof c.id==='string'&&typeof c.num==='string'&&Array.isArray(c.tasks)))throw Error();if(confirm('¿Sustituir todos los expedientes locales por esta copia?')){db=d;await save();home()}}catch{alert('Copia no válida')}}function newCaseForm(){app.innerHTML=`<section><h2>Nuevo expediente</h2><form id="caseForm"><label>Número<input name=num required></label><label>Dirección<input name=addr required></label><label>Teléfono<input name=phone type=tel></label><label>Fecha y hora de visita<input type="datetime-local" name="visit"></label><button type="button" id="createCaseButton" class="primary">Crear expediente</button></form></section>`;const form=document.getElementById('caseForm');const submitCase=async()=>{if(!form.reportValidity())return;let d={num:form.elements.namedItem('num').value,addr:form.elements.namedItem('addr').value,phone:form.elements.namedItem('phone').value};d.num=d.num.trim();if(!d.num||!d.addr.trim()||db.some(c=>c.num===d.num)){alert('Número vacío o duplicado');return}let c={...d,id:String(Date.now()),created:new Date().toISOString(),closed:false,visited:false,visit:form.elements.namedItem("visit").value,tasks:[],notes:'',sketches:[],photos:[]};db.push(c);if(!await save()){db.pop();return;}detail(c.id)};document.getElementById("createCaseButton").addEventListener("click",submitCase);form.addEventListener("submit",e=>{e.preventDefault();submitCase()})}function list(v){showClosed=v;app.innerHTML=`<section><h2>Expedientes ${v==='pending'?'pendientes de visitar':v?'cerrados':'abiertos'}</h2><input id=q placeholder="Buscar número o dirección" oninput="rows()"><select id=sort onchange="rows()"><option value=new>Más recientes primero</option><option value=old>Más antiguos primero</option><option value=due>Próximo vencimiento</option></select><div id=rows></div></section>`;rows()}function due(c){return c.tasks.filter(t=>!t.done&&t.date).map(t=>t.date).sort()[0]||'9999'}function rows(){let q=document.querySelector('#q').value.toLowerCase(),s=document.querySelector('#sort').value;document.querySelector('#rows').innerHTML=db.filter(c=>(showClosed==='pending'?!c.closed&&!c.visited:showClosed?c.closed:!c.closed&&c.visited)&&(c.num+' '+c.addr).toLowerCase().includes(q)).sort((a,b)=>showClosed==='pending'?(a.visit||'9999').localeCompare(b.visit||'9999'):s==='due'?due(a).localeCompare(due(b)):s==='old'?a.created.localeCompare(b.created):b.created.localeCompare(a.created)).map(c=>`<article style="border:1px solid #ddd"><div class=row><button class=grow onclick="detail('${esc(c.id)}')"><b>${esc(c.num)}</b> · ${esc(c.addr)}</button>${c.phone?`<a href="tel:${esc(c.phone.replace(/[^+0-9]/g,''))}">☎</a>`:''}</div><small>${showClosed==='pending'?esc(c.visit?c.visit.replace("T"," "):"Sin concertar")+" · ":""}${esc(c.created.slice(0,10))} · ${c.tasks.filter(t=>!t.done).length} tareas pendientes</small>${due(c)!='9999'?`<div class="${due(c)<today()?'late':''}">Vence: ${due(c)}</div>`:''}</article>`).join('')||'<p>No hay expedientes.</p>'}function detail(id){selected=db.find(c=>c.id===id);let c=selected;app.innerHTML=`<section><h2>${esc(c.num)}</h2><p>${esc(c.addr)}</p><label>Teléfono<input type=tel value="${esc(c.phone)}" onchange="selected.phone=this.value;save();detail(selected.id)"></label>${c.phone?`<a href="tel:${esc(c.phone.replace(/[^+0-9]/g,''))}">☎ Llamar</a>`:''}<label>Fecha y hora de visita<input type="datetime-local" value="${esc(c.visit||'')}" onchange="setVisit(this.value)"></label>${!c.closed&&!c.visited?`<button class="primary" onclick="finishVisit()">Finalizar visita</button>`:""}<p><button onclick="gps()">📍 Guardar ubicación</button> <button onclick="document.querySelector('#photo').click()">Importar fotos de Galería</button><button onclick="document.querySelector('#capture').click()">📷 Sacar fotografía</button><input hidden id=capture type=file accept="image/*" capture="environment" onchange="photos(this,true)"><input hidden id=photo type=file accept="image/*" multiple onchange="photos(this)"><button onclick="editor()">✎ Notas y croquis</button></p><p><small>Captura directa o importación. En captura directa se ofrece descargar una copia al teléfono; comprueba que se conserva.</small></p><small>${esc(c.gps||'Sin ubicación')} · ${c.photos.length} fotos · ${c.sketches.length} croquis</small><p><button onclick="exportCase()">Exportar expediente</button></p></section><section><h2>Tareas pendientes</h2>${c.tasks.map((t,i)=>`<p class=row><input type=checkbox ${t.done?'checked':''} onchange="selected.tasks[${i}].done=this.checked;save();detail(selected.id)"><span class="grow ${!t.done&&t.date&&t.date<today()?'late':''}" style="${t.done?'text-decoration:line-through':''}">${esc(t.name)} ${esc(t.date)}</span><button onclick="if(confirm('¿Eliminar tarea?')){selected.tasks.splice(${i},1);save();detail(selected.id)}">×</button></p>`).join('')}<form id=task><input name=name placeholder="Nueva tarea" required><label>Vencimiento<input type=date name=date></label><button>Añadir tarea</button></form></section><button onclick="if(confirm('¿Cambiar estado del expediente?')){changeClosed()}">${c.closed?'Reabrir':'Cerrar'} expediente</button> <button onclick="list(selected.closed?true:selected.visited?false:"pending")">Volver</button>`;document.querySelector('#task').onsubmit=async e=>{e.preventDefault();c.tasks.push({...Object.fromEntries(new FormData(e.target)),done:false});await save();detail(id)}}async function setVisit(v){let old=selected.visit;selected.visit=v;if(!await save())selected.visit=old;detail(selected.id)}async function finishVisit(){let c=selected;c.visited=true;if(!await save())c.visited=false;detail(c.id)}function gps(){if(!isSecureContext)return alert("El GPS requiere HTTPS o localhost.");if(!navigator.geolocation)return alert('GPS no disponible');navigator.geolocation.getCurrentPosition(async p=>{selected.gps=`${p.coords.latitude}, ${p.coords.longitude} · precisión ${Math.round(p.coords.accuracy)} m · ${new Date().toLocaleString()}`;await save();detail(selected.id)},e=>alert('No se pudo obtener ubicación: '+e.message),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}async function photos(el,capture=false){let c=selected;for(let f of el.files){let url=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});if(capture)download(f.name||"foto.jpg",f,f.type||"image/jpeg");c.photos.push({name:f.name,data:url});if(!await save()){c.photos.pop();break}}detail(c.id)}function editor(){app.innerHTML=`<section><h2>Notas y croquis</h2><textarea id=notes rows=5 placeholder="Observaciones">${esc(selected.notes)}</textarea><div class=row><button onclick="ink='black'">Negro</button><button onclick="ink='red'">Rojo</button><button onclick="ink='blue'">Azul</button><button onclick="ctx.clearRect(0,0,800,500)">Borrar</button></div><canvas id=canvas width=800 height=500></canvas><button onclick="document.querySelector('#canvas').toBlob(b=>{if(b)download('croquis.png',b,'image/png')})">Descargar PNG</button><button class=primary onclick="storeSketch()">Guardar croquis</button><button onclick="saveNotes()">Guardar notas y volver</button>${selected.sketches.map(s=>`<img style="width:100%;border:1px solid #ddd;margin-top:8px" src="${esc(s)}">`).join('')}</section>`;let c=document.querySelector('#canvas');ctx=c.getContext('2d');let active=false;function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height]}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(active){ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.lineCap='round';ctx.lineTo(...pos(e));ctx.stroke()}};c.onpointerup=c.onpointercancel=()=>active=false}let ctx,ink='black';async function storeSketch(){selected.notes=document.querySelector('#notes').value;selected.sketches.push(document.querySelector('#canvas').toDataURL());if(await save()){alert("Croquis guardado. Puedes seguir dibujando o iniciar otro.");}else selected.sketches.pop()}async function changeClosed(){let c=selected;c.closed=!c.closed;if(!await save()){c.closed=!c.closed;return}list(c.closed?true:c.visited?false:"pending")}async function saveNotes(){selected.notes=document.querySelector("#notes").value;if(await save())detail(selected.id)}function exportCase(){download(selected.num+'.json',JSON.stringify(selected),'application/json')}init();if("serviceWorker" in navigator && isSecureContext)navigator.serviceWorker.register("sw.js").catch(console.warn);</script></html>
